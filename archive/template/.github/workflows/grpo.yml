name: GRPO offline tests
on: [push, pull_request]
jobs:
  grpo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[lora,comet]' pytest pytest-cov ruff black mypy
      - run: pytest tests/grpo -q -o addopts='' --cov --cov-fail-under=90
